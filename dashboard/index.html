<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antigravity 双桥接器 · 开发监控</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#19312d;background:#f4f7f6}*{box-sizing:border-box}body{margin:0}header{padding:30px max(24px,5vw);background:#fff;border-bottom:1px solid #dfe8e4}header small{letter-spacing:.15em;color:#627c73}h1{font-size:27px;margin:10px 0}header p{color:#61746d;margin:0;line-height:1.7}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:24px 0}button{font:inherit;border:1px solid #d2dfd9;border-radius:9px;background:white;padding:10px 16px;color:inherit;cursor:pointer}button:hover{border-color:#258269}button.active{color:#fff;background:#236f5b;border-color:#236f5b}button:disabled{cursor:not-allowed;opacity:.45}.spacer{flex:1}main{max-width:1460px;margin:auto;padding:0 24px 36px}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel{background:#fff;border:1px solid #dfe8e4;border-radius:15px;overflow:hidden}.panel h2{font-size:16px;padding:18px 22px;border-bottom:1px solid #edf1ee;margin:0}#tasks{max-height:74vh;overflow:auto}.task{width:100%;text-align:left;border:0;border-bottom:1px solid #edf1ee;border-radius:0;padding:18px 21px}.task.selected{background:#edf7f2}.task strong{display:block;font-size:14px;line-height:1.6;overflow-wrap:anywhere}.task small{display:block;margin-top:8px;color:#6d8178}.badge{font-size:11px;background:#edf2f0;border-radius:5px;padding:3px 6px;display:inline-block;margin-top:7px}.details{padding:22px}dl{display:grid;grid-template-columns:105px 1fr;gap:10px;font-size:13px;line-height:1.6}dt{color:#6c8076}dd{margin:0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;line-height:1.7;background:#f6f8f7;padding:16px;border-radius:9px;max-height:420px;overflow:auto}h3{font-size:14px;margin-top:25px}#notice{font-size:13px;color:#587165}#error{color:#b53636;white-space:pre-wrap;margin:10px 0}#nativeNote{font-size:12px;color:#7d7260;margin-left:12px}.muted{padding:24px;color:#718278;font-size:14px}.event{border-left:2px solid #cfddd6;margin:12px 0;padding-left:13px}.event small{color:#5d786b;font-size:11px}.event pre{margin-top:6px}.statusline{color:#35745f;font-size:13px;margin-top:13px}@media(max-width:800px){.layout{grid-template-columns:1fr}#tasks{max-height:300px}header{padding:24px}h1{font-size:23px}.spacer{display:none}dl{grid-template-columns:90px 1fr}}
</style>
<header><small>ANTIGRAVITY BRIDGE / DEVELOPMENT</small><h1>两条入口，一个清晰的执行记录</h1><p>Codex → Antigravity · DSH → Antigravity。只显示桥接器收到的真实事件和回复。</p><div id="health" class="statusline">正在连接本机服务…</div></header>
<main><div class="toolbar"><button class="filter active" data-client="all">全部任务</button><button class="filter" data-client="codex">Codex → Antigravity</button><button class="filter" data-client="dsh">DSH → Antigravity</button><span class="spacer"></span><label><input id="auto" type="checkbox" checked> 每 3 秒刷新</label><button id="refresh">刷新</button></div><div id="error" role="alert"></div><div class="layout"><aside class="panel"><h2>任务记录</h2><div id="tasks"></div></aside><section class="panel"><h2>执行详情</h2><div id="details" class="details"><p id="empty" class="muted">选择任务，查看会话、事件和结果。</p><div id="body" hidden><dl id="meta"></dl><h3>任务内容</h3><pre id="prompt"></pre><button id="cancel">取消任务</button><span id="nativeNote"></span><h3>结果 / 待补充问题</h3><pre id="result"></pre><h3>错误信息</h3><pre id="failure"></pre><h3>真实事件</h3><div id="events"></div></div></div></section></div><p id="notice">原生 Desktop 的步骤详情请在 Antigravity 查看。桥接器不会虚构工具调用或把超时写成成功。</p></main>
<script>
let client='all',selected=null,rows=[],busy=false;
const $=id=>document.getElementById(id);
async function request(url,body){const r=await fetch(url,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})});const v=await r.json();if(!r.ok)throw Error(v.error||'连接失败');return v}
function text(tag,value,className){const e=document.createElement(tag);e.textContent=value??'';if(className)e.className=className;return e}
function list(){const box=$('tasks');box.replaceChildren();const items=rows.filter(t=>client==='all'||t.client===client);if(!items.length)box.append(text('p','暂无任务。','muted'));for(const t of items){const b=document.createElement('button');b.className='task'+(t.id===selected?' selected':'');b.append(text('strong',t.task),text('small',(t.client==='codex'?'Codex':'DSH')+' · '+new Date(t.created_at).toLocaleString()),text('span',t.status,'badge'));b.onclick=()=>{selected=t.id;list();detail().catch(showError)};box.append(b)}}
function showError(e){$('error').textContent=e.message}
async function detail(){const t=rows.find(t=>t.id===selected);if(!t){$('body').hidden=true;$('empty').hidden=false;return}$('empty').hidden=true;$('body').hidden=false;const meta=$('meta');meta.replaceChildren();for(const [k,v]of [['任务编号',t.id],['来源',t.client],['来源对话',t.conversation_id],['执行会话',t.session_id||'尚未创建'],['状态',t.status],['执行端',t.backend],['模型',t.model||'未知'],['思考档位',t.effort||'模型默认'],['开始时间',t.created_at],['更新时间',t.updated_at],['Token 用量',t.usage?JSON.stringify(t.usage):'未知'],['改动文件',t.files_changed?.length?t.files_changed.join('\n'):'未自动核验，请审查原生应用中的 diff']])meta.append(text('dt',k),text('dd',v));$('prompt').textContent=t.task;$('result').textContent=t.result??'尚未收到结果';$('failure').textContent=t.error??'无';const terminal=['COMPLETED','FAILED','CANCELLED','TIMED_OUT','INTERRUPTED'].includes(t.status);$('cancel').disabled=terminal||(!t.can_cancel&&t.status!=='QUEUED');$('nativeNote').textContent=!terminal&&!t.can_cancel&&t.status!=='QUEUED'?'请在 Antigravity 停止原生会话':'';const data=await request('/api/tasks/'+encodeURIComponent(t.id)+'/events');const events=$('events');events.replaceChildren();for(const e of data.events){const div=text('div','','event');div.append(text('small',e.created_at+' · '+e.type),text('pre',JSON.stringify(e.data,null,2)));events.append(div)}}
async function refresh(){if(busy)return;busy=true;try{const [h,data]=await Promise.all([request('/api/health'),request('/api/tasks')]);$('health').textContent='本机服务正常 · '+h.backend+' · 原生连接'+(h.nativeConnected?'已就绪':'未就绪')+' · '+(h.target?.label||'模型未确认');rows=data.tasks;if(!selected&&rows.length)selected=rows[0].id;list();await detail();$('error').textContent=''}catch(e){showError(e);$('health').textContent='连接异常，请检查诊断'}finally{busy=false}}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{client=b.dataset.client;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));const visible=rows.filter(t=>client==='all'||t.client===client);if(!visible.some(t=>t.id===selected))selected=visible[0]?.id||null;list();detail().catch(showError)});$('refresh').onclick=refresh;$('cancel').onclick=async()=>{try{await request('/api/tasks/'+encodeURIComponent(selected)+'/cancel',{});await refresh()}catch(e){showError(e)}};setInterval(()=>{if($('auto').checked)refresh()},3000);refresh();
</script></html>
